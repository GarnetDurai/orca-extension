<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Tracker</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div class="header">
    <span class="logo-icon">⚡</span>
    <div class="title-container">
      <h1>DSA Tracker</h1>
      <p>LeetCode Behavior & Analytics</p>
    </div>
  </div>

  <div id="statusMsg" class="status-message"></div>

  <!-- Logged Out View -->
  <div id="loginView" class="card">
    <form id="loginForm">
      <div class="form-group">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" class="input-field" placeholder="user@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" class="input-field" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary">Sign In</button>
    </form>
  </div>

  <!-- Logged In View -->
  <div id="profileView" class="card" style="display: none;">
    <div class="user-info">
      <div style="font-size: 11px; color: var(--text-secondary);">Logged in as</div>
      <div id="userEmailDisplay" class="user-email"></div>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Tracking Active</span>
      </div>
    </div>
    <button id="logoutBtn" class="btn btn-secondary">Log Out</button>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
